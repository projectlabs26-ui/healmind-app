name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx4G -XX:MaxMetaspaceSize=1G -Dorg.gradle.daemon=false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      # =====================
      # DEBUG BUILD
      # =====================
      - name: Build APK (Debug)
        if: github.event_name == 'push' || github.event.inputs.build_type == 'debug'
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: healmind-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # =====================
      # RELEASE BUILD
      # =====================
      - name: Decode keystore
        if: github.event.inputs.build_type == 'release'
        env:
          B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi
          mkdir -p android/app
          echo "$B64" | base64 -d > android/app/keystore.jks
          SIZE=$(wc -c < android/app/keystore.jks)
          echo "Keystore decoded: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: Keystore file too small ($SIZE bytes). Wrong base64?"
            exit 1
          fi

      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release'
        run: flutter build apk --release
        env:
          KEY_STORE_FILE: keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: healmind

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: healmind-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30